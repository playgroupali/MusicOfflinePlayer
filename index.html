<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline Music Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        /* Modern Minimalist Dark Base */
        body { 
            background-color: #050505; 
            color: #FFFFFF; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        /* App Master Frame Layout Wrapper */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 760px;
            gap: 30px;
            align-items: center;
        }
        
        /* Player Module Dashboard Frame */
        .player-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
            background-color: #0b0b0d;
            border: 1px solid #16161a;
            border-radius: 24px;
            padding: 30px 24px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h2 { 
            font-weight: 700; 
            font-size: 24px;
            letter-spacing: -0.5px; 
            margin: 0 0 6px 0; 
            color: #FFFFFF;
        }
        
        #track-name { 
            color: #A3A3A3; 
            font-size: 14px; 
            margin: 0 0 30px 0; 
            padding: 0 5px; 
            text-overflow: ellipsis; 
            overflow: hidden; 
            white-space: nowrap; 
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        
        /* Premium Blue Gradient Play Orb */
        .touch-pad { 
            width: 160px; 
            height: 160px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%); 
            box-shadow: 0 12px 30px rgba(67, 100, 247, 0.35), inset 0 -4px 8px rgba(0,0,0,0.3); 
            margin: 0 auto 25px auto; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 44px; 
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent; 
            transition: transform 0.1s ease; 
        }
        .touch-pad:active { transform: scale(0.95); }

        /* Sleek Timeline Container Box */
        .seeker-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 25px;
            padding: 0 5px;
            box-sizing: border-box;
        }
        .time-box {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            color: #737373;
        }
        
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 10px;
            background: #1a1a1f;
            outline: none;
            cursor: pointer;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(67, 100, 247, 0.9);
        }
        
        input[type="file"] { display: none; }
        
        .btn { 
            background-color: #FFFFFF; 
            padding: 14px 20px; 
            border-radius: 30px; 
            border: none; 
            color: #050505; 
            font-weight: 700; 
            font-size: 14px; 
            cursor: pointer; 
            display: inline-block; 
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background-color: #E5E5E5; }

        /* Queue Dashboard Modular Sidebars */
        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 340px;
        }

        .recents-container {
            background-color: #0b0b0d;
            border: 1px solid #16161a;
            border-radius: 24px;
            width: 100%;
            padding: 24px;
            text-align: left;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .recents-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4364F7;
            margin: 0 0 14px 4px;
            font-weight: 700;
        }
        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }
        .song-item {
            padding: 12px 10px;
            border-radius: 12px;
            font-size: 14px;
            color: #D4D4D4;
            cursor: pointer;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 1px solid #141417;
            transition: background 0.15s, color 0.15s;
        }
        .song-item:last-child { border-bottom: none; }
        .song-item:active { background-color: #16161f; color: #6FB1FC; }
        .empty-text { color: #404040; font-size: 13px; padding: 10px 0; text-align: center; }

        @media (min-width: 680px) {
            .app-container {
                flex-direction: row-reverse;
                justify-content: center;
                align-items: flex-start;
                gap: 40px;
            }
            .player-main { max-width: 340px; }
            .sidebar-section { max-width: 320px; }
        }
    </style>
</head>
<body>
