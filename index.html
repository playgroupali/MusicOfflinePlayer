<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline Music Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body { background-color: #050505; color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; box-sizing: border-box; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .app-container { display: flex; flex-direction: column; width: 100%; max-width: 760px; gap: 30px; align-items: center; }
        .player-main { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 340px; background-color: #0b0b0d; border: 1px solid #16161a; border-radius: 24px; padding: 30px 24px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { font-weight: 700; font-size: 24px; margin: 0 0 6px 0; }
        #track-name { color: #A3A3A3; font-size: 14px; margin: 0 0 30px 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; width: 100%; text-align: center; }
        .touch-pad { width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%); box-shadow: 0 12px 30px rgba(67, 100, 247, 0.35); margin: 0 auto 25px auto; display: flex; align-items: center; justify-content: center; font-size: 44px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .touch-pad:active { transform: scale(0.95); }
        .seeker-container { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 25px; box-sizing: border-box; }
        .time-box { display: flex; justify-content: space-between; font-size: 11px; color: #737373; }
        .slider { -webkit-appearance: none; width: 100%; height: 5px; border-radius: 10px; background: #1a1a1f; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; }
        input[type="file"] { display: none; }
        .btn { background-color: #FFFFFF; padding: 14px 20px; border-radius: 30px; border: none; color: #050505; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; text-align: center; -webkit-tap-highlight-color: transparent; }
        .sidebar-section { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 340px; }
        .recents-container { background-color: #0b0b0d; border: 1px solid #16161a; border-radius: 24px; width: 100%; padding: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); box-sizing: border-box; }
        .recents-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #4364F7; margin: 0 0 14px 4px; font-weight: 700; }
        .song-list { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
        .song-item { padding: 12px 10px; border-radius: 12px; font-size: 14px; color: #D4D4D4; cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #141417; }
        .song-item:last-child { border-bottom: none; }
        .song-item:active { background-color: #16161f; color: #6FB1FC; }
        .empty-text { color: #404040; font-size: 13px; padding: 10px 0; text-align: center; }
        @media (min-width: 680px) { .app-container { flex-direction: row-reverse; gap: 40px; } .player-main { max-width: 340px; } .sidebar-section { max-width: 320px; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-main">
            <h2>Offline Music Player</h2>
            <p id="track-name">No track loaded</p>
            <div class="touch-pad" id="playBtn">▶️</div>
            <div class="seeker-container">
                <input type="range" id="seekSlider" class="slider" min="0" max="100" value="0">
                <div class="time-box"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div>
            </div>
            <label class="btn">Browse Files<input type="file" id="audioFile" accept="*/*"></label>
        </div>

        <div class="sidebar-section">
            <div class="recents-container">
                <div class="recents-title">My GitHub Vault</div>
                <ul class="song-list" id="vaultList">
                    <li class="empty-text" id="vaultLoadingMessage">Scanning tracks folder...</li>
                </ul>
            </div>

            <div class="recents-container">
                <div class="recents-title">Recent Songs</div>
                <ul class="song-list" id="recentList">
                    <li class="empty-text" id="emptyMessage">No recently played songs</li>
                </ul>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const fileInput = document.getElementById('audioFile');
        const trackName = document.getElementById('track-name');
        const recentList = document.getElementById('recentList');
        const vaultList = document.getElementById('vaultList');
        const emptyMessage = document.getElementById('emptyMessage');
        const vaultLoadingMessage = document.getElementById('vaultLoadingMessage');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationTimeDisplay = document.getElementById('durationTime');
        
        let recentSongs = [];

        // 🛠️ AUTO-DETECTION CONFIGURATION
        // It reads your current URL layout to find your exact repository files
        const username = window.location.hostname.split('.')[0];
        const repoName = window.location.pathname.split('/')[1];
        const apiUrl = `https://github.com{username}/${repoName}/contents/tracks`;

        async function scanGitHubTracksFolder() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Folder empty or not found");
                const files = await response.json();
                
                // Filter out everything except valid music formats
                const audioFiles = files.filter(file => 
                    file.name.endsWith('.mp3') || 
                    file.name.endsWith('.m4a') || 
                    file.name.endsWith('.wav')
                );

                if (audioFiles.length === 0) {
                    vaultLoadingMessage.innerText = "No music files inside 'tracks/'";
                    return;
                }

                vaultList.innerHTML = ""; // Clear loader text
                audioFiles.forEach(file => {
                    const cleanName = file.name.replace(/\.[^/.]+$/, ""); // Strip extension for clean title display
                    const li = document.createElement('li');
                    li.className = 'song-item';
                    li.innerText = `🎵 ${cleanName}`;
                    li.addEventListener('click', () => {
                        playSecureVaultTrack(cleanName, file.name);
                    });
                    vaultList.appendChild(li);
                });
            } catch (error) {
                vaultLoadingMessage.innerText = "Add MP3s to your tracks/ folder";
                console.error("Scanning Error:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            scanGitHubTracksFolder();
            const savedSongs = localStorage.getItem('my_vault_tracks');
            if (savedSongs) {
                try { recentSongs = JSON.parse(savedSongs); renderRecentList(); } catch (e) {}
            }
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                trackName.innerText = file.name;
                audio.src = URL.createObjectURL(file);
                audio.play();
                playBtn.innerText = "⏸️";
                addSongToRecents(file.name, "LOCAL", "");
            }
        });

        function playSecureVaultTrack(title, fileName) {
            trackName.innerText = title;
            audio.src = `tracks/${fileName}`;
            audio.play();
            playBtn.innerText = "⏸️";
            addSongToRecents(title, "VAULT", fileName);
        }

        playBtn.addEventListener('click', () => {
            if (!audio.src) return; 
            if (audio.paused) { audio.play(); playBtn.innerText = "⏸️"; } 
            else { audio.pause(); playBtn.innerText = "▶️"; }
        });

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                seekSlider.value = (audio.currentTime / audio.duration) * 100;
                currentTimeDisplay.innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => { durationTimeDisplay.innerText = formatTime(audio.duration); });
        seekSlider.addEventListener('input', () => { if (audio.src && !isNaN(audio.duration)) { audio.currentTime = (seekSlider.value / 100) * audio.duration; } });

        function formatTime(secs) {
            const minutes = Math.floor(secs / 60); const seconds = Math.floor(secs % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function addSongToRecents(name, type, filename) {
            recentSongs = recentSongs.filter(song => song.name !== name);
            recentSongs.unshift({ name: name, type: type, file: filename });
            if (recentSongs.length > 6) recentSongs.pop();
localStorage.setItem('my_vault_tracks', JSON.stringify(recentSongs));
renderRecentList();
}
function renderRecentList() {
if (recentSongs.length > 0 && emptyMessage) emptyMessage.style.display = 'none';
recentList.innerHTML = "";
recentSongs.forEach(song => {
const li = document.createElement('li'); li.className = 'song-item'; li.innerText = song.name;
li.addEventListener('click', () => {
if (song.type === "VAULT") { playSecureVaultTrack(song.name, song.file); }
else { trackName.innerText = song.name; alert("Tap 'Browse Files' to reload manual track:\n" + song.name); }
});
recentList.appendChild(li);
});
}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
