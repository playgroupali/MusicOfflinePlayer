<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline Music Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root { --bg-body: #050505; --bg-player: #0b0b0d; --border-player: #16161a; --text-main: #FFFFFF; --text-muted: #A3A3A3; --theme-color: #4364F7; --theme-gradient: linear-gradient(135deg, #0052D4, #4364F7, #6FB1FC); --theme-glow: rgba(67, 100, 247, 0.35); --slider-bg: #1a1a1f; }
        @media (prefers-color-scheme: light) { :root { --bg-body: #F5F7FA; --bg-player: #FFFFFF; --border-player: #E4E7EB; --text-main: #1A1A1A; --text-muted: #71717A; --slider-bg: #E4E7EB; } }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; box-sizing: border-box; display: flex; justify-content: center; align-items: center; padding: 30px 20px; transition: background-color 0.3s; }
        .app-container { display: flex; flex-direction: column; width: 100%; max-width: 340px; gap: 25px; align-items: center; position: relative; }
        .player-main { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; background-color: var(--bg-player); border: 1px solid var(--border-player); border-radius: 24px; padding: 30px 24px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.4); transition: background-color 0.3s, border-color 0.3s; }
        h2 { font-weight: 700; font-size: 24px; letter-spacing: -0.5px; margin: 0 0 6px 0; }
        .settings-btn { position: absolute; top: 24px; right: 24px; font-size: 20px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; z-index: 5; }
        #track-name { color: var(--text-muted); font-size: 14px; margin: 0 0 30px 0; padding: 0 5px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; width: 100%; box-sizing: border-box; text-align: center; }
        .touch-pad { width: 170px; height: 170px; border-radius: 50%; background: var(--theme-gradient); box-shadow: 0 12px 30px var(--theme-glow), inset 0 -4px 8px rgba(0,0,0,0.2); margin: 0 auto 30px auto; display: flex; align-items: center; justify-content: center; font-size: 46px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .touch-pad:active { transform: scale(0.95); }
        .seeker-container { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; padding: 0 5px; box-sizing: border-box; }
        .time-box { display: flex; justify-content: space-between; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-muted); }
        .slider { -webkit-appearance: none; width: 100%; height: 5px; border-radius: 10px; background: var(--slider-bg); outline: none; cursor: pointer; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 10px var(--theme-color); }
        input[type="file"] { display: none; }
        .btn { background-color: var(--text-main); padding: 14px 20px; border-radius: 30px; border: none; color: var(--bg-body); font-weight: 700; font-size: 15px; cursor: pointer; display: inline-block; width: 100%; box-sizing: border-box; text-align: center; -webkit-tap-highlight-color: transparent; }
        .theme-drawer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-player); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; z-index: 10; border: 1px solid var(--border-player); }
        .drawer-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
        .theme-dot { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: 0 4px 10px rgba(0,0,0,0.15); -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="player-main">
            <div class="settings-btn" onclick="toggleThemeDrawer(true)">⚙️</div>
            <h2>Offline Player</h2>
            <p id="track-name">No track loaded</p>
            <div class="touch-pad" id="playBtn">▶️</div>
            <div class="seeker-container">
                <input type="range" id="seekSlider" class="slider" min="0" max="100" value="0">
                <div class="time-box"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div>
            </div>
            <label class="btn">Choose Audio File<input type="file" id="audioFile" accept="*/*"></label>
            <div class="theme-drawer" id="themeDrawer">
                <div class="drawer-title">Select App Theme</div>
                <div class="theme-grid">
                    <div class="theme-dot" style="background: #ef4444;" onclick="changeAppTheme('red')"></div>
                    <div class="theme-dot" style="background: #f97316;" onclick="changeAppTheme('orange')"></div>
                    <div class="theme-dot" style="background: #eab308;" onclick="changeAppTheme('yellow')"></div>
                    <div class="theme-dot" style="background: #4364F7;" onclick="changeAppTheme('blue')"></div>
                    <div class="theme-dot" style="background: #22c55e;" onclick="changeAppTheme('green')"></div>
                    <div class="theme-dot" style="background: #a855f7;" onclick="changeAppTheme('purple')"></div>
                    <div class="theme-dot" style="background: #ec4899;" onclick="changeAppTheme('pink')"></div>
                    <div class="theme-dot" style="background: #ffffff;" onclick="changeAppTheme('white')"></div>
                </div>
                <button class="btn" style="max-width: 150px; padding: 10px;" onclick="toggleThemeDrawer(false)">Close</button>
            </div>
        </div>
    </div>
    <audio id="audioPlayer"></audio>
    <script>
        const audio = document.getElementById('audioPlayer'); const playBtn = document.getElementById('playBtn'); const fileInput = document.getElementById('audioFile'); const trackName = document.getElementById('track-name'); const seekSlider = document.getElementById('seekSlider'); const currentTimeDisplay = document.getElementById('currentTime'); const durationTimeDisplay = document.getElementById('durationTime'); const themeDrawer = document.getElementById('themeDrawer');
        const themeProfiles = {
            red: { color: '#ef4444', glow: 'rgba(239,68,68,0.35)', gradient: 'linear-gradient(135deg,#b91c1c,#ef4444,#fca5a5)' },
            orange: { color: '#f97316', glow: 'rgba(249,115,22,0.35)', gradient: 'linear-gradient(135deg,#c2410c,#f97316,#fed7aa)' },
            yellow: { color: '#eab308', glow: 'rgba(234,179,8,0.35)', gradient: 'linear-gradient(135deg,#a16207,#eab308,#fef08a)' },
            blue: { color: '#4364F7', glow: 'rgba(67,100,247,0.35)', gradient: 'linear-gradient(135deg,#0052D4,#4364F7,#6FB1FC)' },
            green: { color: '#22c55e', glow: 'rgba(34,197,94,0.35)', gradient: 'linear-gradient(135deg,#15803d,#22c55e,#86efac)' },
            purple: { color: '#a855f7', glow: 'rgba(168,85,247,0.35)', gradient: 'linear-gradient(135deg,#6b21a8,#a855f7,#e9d5ff)' },
            pink: { color: '#ec4899', glow: 'rgba(236,72,153,0.35)', gradient: 'linear-gradient(135deg,#ec4899,#f472b6,#fbcfe8)' },
            white: { color: '#ffffff', glow: 'rgba(255,255,255,0.25)', gradient: 'linear-gradient(135deg,#737373,#ffffff,#e5e5e5)' }
        };
        function toggleThemeDrawer(show) { themeDrawer.style.display = show ? 'flex' : 'none'; }
        function changeAppTheme(themeName) {
            const root = document.documentElement; const chosen = themeProfiles[themeName] || themeProfiles.blue;
            root.style.setProperty('--theme-color', chosen.color); root.style.setProperty('--theme-glow', chosen.glow); root.style.setProperty('--theme-gradient', chosen.gradient);
            localStorage.setItem('user_app_color_theme', themeName);
        }
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files; if (files && files.length > 0) { const file = files[0]; trackName.innerText = file.name; audio.src = URL.createObjectURL(file); audio.play(); playBtn.innerText = "⏸️"; }
        });
        playBtn.addEventListener('click', () => { if (!audio.src) return; if (audio.paused) { audio.play(); playBtn.innerText = "⏸️"; } else { audio.pause(); playBtn.innerText = "▶️"; } });
        audio.addEventListener('timeupdate', () => { if (!isNaN(audio.duration)) { seekSlider.value = (audio.currentTime / audio.duration) * 100; currentTimeDisplay.innerText = formatTime(audio.currentTime); } });
        audio.addEventListener('loadedmetadata', () => { durationTimeDisplay.innerText = formatTime(audio.duration); });
        seekSlider.addEventListener('input', () => { if (audio.src && !isNaN(audio.duration)) { audio.currentTime = (seekSlider.value / 100) * audio.duration; } });
        function formatTime(secs) { const m = Math.floor(secs / 60); const s = Math.floor(secs % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; }
        window.addEventListener('DOMContentLoaded', () => { const savedTheme = localStorage.getItem('user_app_color_theme'); changeAppTheme(savedTheme || 'blue'); });
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
