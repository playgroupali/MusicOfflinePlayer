<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline Music Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        /* BASELINE AUTOMATIC: Light state defaults */
        :root {
            --bg-body: #F0F7FF; 
            --bg-player: #FFFFFF; 
            --border-player: #E1EFFE; 
            --text-main: #1E3A8A; 
            --text-muted: #6B7280;
            --orb-gradient: linear-gradient(135deg, #60A5FA 0%, #3B82F6 50%, #1D4ED8 100%); 
            --orb-shadow: rgba(59, 130, 246, 0.25);
            --slider-bg: #E5E7EB;
            --slider-thumb: #ffffff; /* Normal light mode system circle stays clean white */
            --btn-bg: #1D4ED8; 
            --btn-text: #FFFFFF;
        }

        /* BASELINE AUTOMATIC: Dark state defaults (Triggers matching device) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #050505;
                --bg-player: #0b0b0d;
                --border-player: #16161a;
                --text-main: #FFFFFF;
                --text-muted: #A3A3A3;
                --orb-gradient: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%);
                --orb-shadow: rgba(67, 100, 247, 0.35);
                --slider-bg: #1a1a1f;
                --slider-thumb: #ffffff; /* Normal dark mode system circle stays clean white */
                --btn-bg: #FFFFFF;
                --btn-text: #050505;
            }
        }

        /* FIXED SPECIFIC MODE: Triggers ONLY when selecting the custom White Color Theme button */
        body.color-theme-white-manual {
            --bg-body: #F4F4F5 !important;
            --bg-player: #ffffff !important;
            --border-player: rgba(0,0,0,0.08) !important;
            --text-main: #000000 !important;
            --text-muted: #71717a !important;
            --orb-gradient: linear-gradient(135deg, #E2E8F0 0deg, #FFFFFF 180deg, #E2E8F0 360deg) !important;
            --orb-shadow: rgba(0,0,0,0.05) !important;
            --slider-bg: #d4d4d8 !important;
            /* CRITICAL OVERWRITE: Force tracker circle to turn solid black inside this manual state [INDEX] */
            --slider-thumb: #000000 !important; 
            --btn-bg: #000000 !important;
            --btn-text: #ffffff !important;
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; min-height: 100vh; box-sizing: border-box;
            display: flex; justify-content: center; align-items: center; padding: 30px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container { display: flex; flex-direction: column; width: 100%; max-width: 340px; gap: 25px; align-items: center; }
        .player-main {
            position: relative; display: flex; flex-direction: column; align-items: center; width: 100%;
            background-color: var(--bg-player); border: 1px solid var(--border-player); border-radius: 24px;
            padding: 30px 24px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .settings-trigger {
            position: absolute; top: 22px; right: 22px; font-size: 18px; cursor: pointer;
            opacity: 0.6; -webkit-tap-highlight-color: transparent; z-index: 10;
        }
        .settings-trigger:active { transform: scale(0.9); }

        h2 { font-weight: 700; font-size: 24px; letter-spacing: -0.5px; margin: 0 0 6px 0; }
        
        #track-name { 
            color: var(--text-muted); font-size: 14px; margin: 0 0 30px 0; padding: 0 5px; 
            text-overflow: ellipsis; overflow: hidden; white-space: nowrap; width: 100%;
            box-sizing: border-box; text-align: center;
        }
        
        .touch-pad { 
            width: 170px; height: 170px; border-radius: 50%; 
            background: var(--orb-gradient); 
            box-shadow: 0 12px 30px var(--orb-shadow), inset 0 -4px 8px rgba(0,0,0,0.15); 
            margin: 0 auto 30px auto; display: flex; align-items: center; justify-content: center; 
            font-size: 46px; cursor: pointer; -webkit-tap-highlight-color: transparent; 
            transition: transform 0.1s ease; 
        }
        .touch-pad:active { transform: scale(0.95); }

        .seeker-container { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; padding: 0 5px; box-sizing: border-box; }
        .time-box { display: flex; justify-content: space-between; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-muted); }
        
        .slider { -webkit-appearance: none; width: 100%; height: 5px; border-radius: 10px; background: var(--slider-bg) !important; outline: none; cursor: pointer; transition: background 0.3s; }
        
        /* Premium custom slider circle layout thumb injection configs */
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none !important; appearance: none !important; 
            width: 16px !important; height: 16px !important; border-radius: 50% !important;
            background: var(--slider-thumb) !important; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.3) !important;
            transition: background 0.3s ease;
        }
        
        input[type="file"] { display: none; }
        
        .btn { 
            background-color: var(--btn-bg); padding: 14px 20px; border-radius: 30px; border: none; 
            color: var(--btn-text); font-weight: 700; font-size: 15px; cursor: pointer; 
            display: inline-block; width: 100%; box-sizing: border-box; text-align: center; -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .btn:active { opacity: 0.85; }

        .theme-panel {
            position: absolute; top: 52px; right: 22px; background: var(--bg-player);
            border: 1px solid var(--border-player); border-radius: 14px; padding: 8px;
            display: none; flex-direction: column; gap: 4px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); z-index: 40;
        }
        .theme-opt {
            padding: 8px 16px; font-size: 12px; font-weight: 600; border-radius: 8px;
            cursor: pointer; text-align: left; min-width: 130px; color: var(--text-main);
        }
        .theme-opt:active { background: rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-main">
            <!-- Gear Icon configuration trigger drop decks -->
            <div class="settings-trigger" id="gearBtn" onclick="toggleThemeDropdownPanel()">⚙️</div>
            
            <div class="theme-panel" id="themeDropdownMenu">
                <div class="theme-opt" onclick="swapPlayerThemeProfile('AUTO')">🔄 Auto Device Mode</div>
                <div class="theme-opt" onclick="swapPlayerThemeProfile('WHITE_COLOR_THEME')">☀️ White Color Theme</div>
            </div>

            <h2>Offline Player</h2>
            <p id="track-name">No track loaded</p>
            
            <div class="touch-pad" id="playBtn">▶️</div>
            
            <div class="seeker-container">
                <input type="range" id="seekSlider" class="slider" min="0" max="100" value="0">
                <div class="time-box">
                    <span id="currentTime">0:00</span>
                    <span id="durationTime">0:00</span>
                </div>
            </div>
            
            <label class="btn">Choose Audio File<input type="file" id="audioFile" accept="*/*"></label>
        </div>
    </div>

    <audio id="audioPlayer"></audio>
    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const fileInput = document.getElementById('audioFile');
        const trackName = document.getElementById('track-name');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationTimeDisplay = document.getElementById('durationTime');
        const themeMenu = document.getElementById('themeDropdownMenu');

        function toggleThemeDropdownPanel() {
            themeMenu.style.display = themeMenu.style.display === 'flex' ? 'none' : 'flex';
        }

        function swapPlayerThemeProfile(mode) {
            themeMenu.style.display = 'none';
            document.body.className = ""; // Reset custom modifier selectors
            
            if (mode === 'WHITE_COLOR_THEME') {
                document.body.classList.add('color-theme-white-manual');
                localStorage.setItem('player_manual_theme_selection', 'WHITE_COLOR_THEME');
            } else {
                localStorage.setItem('player_manual_theme_selection', 'AUTO');
            }
        }

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files;
                trackName.innerText = file.name ? file.name : "Local Track File";
                audio.src = URL.createObjectURL(file);
                audio.play();
                playBtn.innerText = "⏸️";
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audio.src) return; 
            if (audio.paused) { audio.play(); playBtn.innerText = "⏸️"; } 
            else { audio.pause(); playBtn.innerText = "▶️"; }
        });

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                seekSlider.value = (audio.currentTime / audio.duration) * 100;
                currentTimeDisplay.innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => { durationTimeDisplay.innerText = formatTime(audio.duration); });
        seekSlider.addEventListener('input', () => { if (audio.src && !isNaN(audio.duration)) { audio.currentTime = (seekSlider.value / 100) * audio.duration; } });

        function formatTime(secs) {
            const minutes = Math.floor(secs / 60); const seconds = Math.floor(secs % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedMode = localStorage.getItem('player_manual_theme_selection') || 'AUTO';
            swapPlayerThemeProfile(savedMode);
        });

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
