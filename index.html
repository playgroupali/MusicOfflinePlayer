<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>offline music play</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Modern Dark Theme Base */
        body { 
            background-color: #050505; 
            color: #FFFFFF; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 60px 20px; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* Clean White Headings */
        h2 { 
            font-weight: 700; 
            font-size: 26px;
            letter-spacing: -0.5px; 
            margin-bottom: 8px; 
            color: #FFFFFF;
        }
        
        /* Muted White/Gray Status Text */
        #track-name { 
            color: #A3A3A3; 
            font-size: 15px; 
            margin-bottom: 40px; 
            padding: 0 20px; 
            text-overflow: ellipsis; 
            overflow: hidden; 
            white-space: nowrap; 
        }
        
        /* Electric Blue Gradient Controller Button */
        .touch-pad { 
            width: 220px; 
            height: 220px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%); 
            box-shadow: 0 15px 35px rgba(67, 100, 247, 0.4), inset 0 -4px 10px rgba(0,0,0,0.3); 
            margin: 0 auto 40px auto; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 54px; 
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent; 
            transition: transform 0.1s ease; 
        }
        
        /* Tactile Press Effect */
        .touch-pad:active { 
            transform: scale(0.95); 
        }
        
        input[type="file"] { 
            display: none; 
        }
        
        /* Clean High-Contrast White Action Button */
        .btn { 
            background-color: #FFFFFF; 
            padding: 16px 40px; 
            border-radius: 30px; 
            border: none; 
            color: #050505; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(255,255,255,0.1); 
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 40px;
        }
        
        .btn:active { 
            background-color: #E5E5E5; 
        }

        /* Recent Songs Container Layout */
        .recents-container {
            background-color: #121214;
            border: 1px solid #222;
            border-radius: 20px;
            max-width: 320px;
            margin: 0 auto;
            padding: 20px;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .recents-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4364F7;
            margin: 0 0 12px 5px;
            font-weight: 700;
        }
        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }
        .song-item {
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 14px;
            color: #E5E5E5;
            cursor: pointer;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            transition: background 0.2s;
            border-bottom: 1px solid #1a1a1f;
        }
        .song-item:last-child {
            border-bottom: none;
        }
        .song-item:active {
            background-color: #1e1e24;
            color: #6FB1FC;
        }
        .empty-text {
            color: #555;
            font-size: 13px;
            margin: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>offline music play</h2>
    <p id="track-name">No track loaded</p>

    <!-- Glowing Electric Blue Main Button -->
    <div class="touch-pad" id="playBtn">▶️</div>

    <!-- Completely Unlocked Selection Button (*/* opens all file formats) -->
    <label class="btn">
        Choose Audio File
        <input type="file" id="audioFile" accept="*/*">
    </label>

    <!-- Recent Tracks Module Component -->
    <div class="recents-container">
        <div class="recents-title">Recent Songs</div>
        <ul class="song-list" id="recentList">
            <li class="empty-text" id="emptyMessage">No recently played songs</li>
        </ul>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const fileInput = document.getElementById('audioFile');
        const trackName = document.getElementById('track-name');
        const recentList = document.getElementById('recentList');
        const emptyMessage = document.getElementById('emptyMessage');

        let recentSongs = [];

        // Load saved song list from phone's hard memory as soon as app launches
        window.addEventListener('DOMContentLoaded', () => {
            const savedSongs = localStorage.getItem('my_offline_tracks');
            if (savedSongs) {
                try {
                    recentSongs = JSON.parse(savedSongs);
                    renderRecentList();
                } catch (e) {
                    console.log("Error loading saved songs");
                }
            }
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                
                const displayName = file.name ? file.name : "Local Track File";
                trackName.innerText = displayName;
                
                // Create audio system pointer stream
                audio.src = URL.createObjectURL(file);
                audio.play();
                playBtn.innerText = "⏸️";

                // Save song name permanently into phone's history
                addSongToRecents(displayName);
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audio.src) return; 
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸️";
            } else {
                audio.pause();
                playBtn.innerText = "▶️";
            }
        });

        function addSongToRecents(name) {
            // Filter duplicates out to keep history neat
            recentSongs = recentSongs.filter(songName => songName !== name);
            
            // Push newest track straight to the top entry slot
            recentSongs.unshift(name);

            // Keep list caps under 7 items max limits
            if (recentSongs.length > 7) recentSongs.pop();

            // Save the list into the phone storage engine
            localStorage.setItem('my_offline_tracks', JSON.stringify(recentSongs));

            renderRecentList();
        }

        function renderRecentList() {
            if (recentSongs.length > 0 && emptyMessage) {
                emptyMessage.style.display = 'none';
            }
            
            recentList.innerHTML = "";
            recentSongs.forEach(songName => {
                const li = document.createElement('li');
                li.className = 'song-item';
                li.innerText = songName;
                
                // Reminder hint warning due to Apple browser file container security blocks
                li.addEventListener('click', () => {
                    trackName.innerText = songName;
                    alert("Tap 'Choose Audio File' to select and play: \n" + songName);
                });
                recentList.appendChild(li);
            });
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
