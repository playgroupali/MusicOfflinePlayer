<!DOCTYPE html>
<html lang="en">
<head>
        <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://postimg.cc">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>offline music play</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            background-color: #050505; 
            color: #FFFFFF; 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            gap: 40px;
            align-items: center;
        }
        .player-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
        }
        h2 { 
            font-weight: 700; 
            font-size: 26px;
            letter-spacing: -0.5px; 
            margin: 0 0 8px 0; 
            color: #FFFFFF;
            text-align: center;
        }
        #track-name { 
            color: #A3A3A3; 
            font-size: 15px; 
            margin: 0 0 35px 0; 
            padding: 0 10px; 
            text-overflow: ellipsis; 
            overflow: hidden; 
            white-space: nowrap; 
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .touch-pad { 
            width: 200px; 
            height: 200px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%); 
            box-shadow: 0 15px 35px rgba(67, 100, 247, 0.4); 
            margin: 0 auto 30px auto; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 54px; 
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent; 
            transition: transform 0.1s ease; 
        }
        .touch-pad:active { transform: scale(0.95); }
        .seeker-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 35px;
        }
        .time-box {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #A3A3A3;
            padding: 0 5px;
        }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #222;
            outline: none;
            cursor: pointer;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6FB1FC;
            box-shadow: 0 0 10px rgba(67, 100, 247, 0.8);
        }
        input[type="file"] { display: none; }
        .btn { 
            background-color: #FFFFFF; 
            padding: 16px 40px; 
            border-radius: 30px; 
            border: none; 
            color: #050505; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            display: inline-block; 
            width: 100%;
            max-width: 240px;
            box-sizing: border-box;
            text-align: center;
        }
        .btn:active { background-color: #E5E5E5; }
        .recents-container {
            background-color: #121214;
            border: 1px solid #222;
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .recents-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4364F7;
            margin: 0 0 12px 5px;
            font-weight: 700;
        }
        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }
        .song-item {
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 14px;
            color: #E5E5E5;
            cursor: pointer;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 1px solid #1a1a1f;
        }
        .song-item:last-child { border-bottom: none; }
        .song-item:active { background-color: #1e1e24; color: #6FB1FC; }
        .empty-text { color: #555; font-size: 13px; margin: 5px; text-align: center; }

        @media (min-width: 650px) {
            .app-container {
                flex-direction: row-reverse;
                justify-content: center;
                align-items: flex-start;
                gap: 50px;
            }
            .player-main { max-width: 360px; }
            .recents-container { max-width: 300px; margin-top: 15px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="player-main">
            <h2>offline music play</h2>
            <p id="track-name">No track loaded</p>
            <div class="touch-pad" id="playBtn">▶️</div>
            <div class="seeker-container">
                <input type="range" id="seekSlider" class="slider" min="0" max="100" value="0">
                <div class="time-box">
                    <span id="currentTime">0:00</span>
                    <span id="durationTime">0:00</span>
                </div>
            </div>
            <label class="btn">
                Choose Audio File
                <input type="file" id="audioFile" accept="*/*">
            </label>
        </div>
        <div class="recents-container">
            <div class="recents-title">Recent Songs</div>
            <ul class="song-list" id="recentList">
                <li class="empty-text" id="emptyMessage">No recently played songs</li>
            </ul>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const fileInput = document.getElementById('audioFile');
        const trackName = document.getElementById('track-name');
        const recentList = document.getElementById('recentList');
        const emptyMessage = document.getElementById('emptyMessage');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationTimeDisplay = document.getElementById('durationTime');

        let recentSongs = [];

        window.addEventListener('DOMContentLoaded', () => {
            const savedSongs = localStorage.getItem('my_offline_tracks');
            if (savedSongs) {
                try {
                    recentSongs = JSON.parse(savedSongs);
                    renderRecentList();
                } catch (e) {}
            }
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const displayName = file.name ? file.name : "Local Track File";
                trackName.innerText = displayName;
                audio.src = URL.createObjectURL(file);
                audio.play();
                playBtn.innerText = "⏸️";
                addSongToRecents(displayName);
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audio.src) return; 
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸️";
            } else {
                audio.pause();
                playBtn.innerText = "▶️";
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const progress = (audio.currentTime / audio.duration) * 100;
                seekSlider.value = progress;
                currentTimeDisplay.innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeDisplay.innerText = formatTime(audio.duration);
        });

        seekSlider.addEventListener('input', () => {
            if (audio.src && !isNaN(audio.duration)) {
                audio.currentTime = (seekSlider.value / 100) * audio.duration;
            }
        });

        function formatTime(secs) {
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function addSongToRecents(name) {
            recentSongs = recentSongs.filter(songName => songName !== name);
            recentSongs.unshift(name);
            if (recentSongs.length > 7) recentSongs.pop();
            localStorage.setItem('my_offline_tracks', JSON.stringify(recentSongs));
            renderRecentList();
        }

        function renderRecentList() {
            if (recentSongs.length > 0 && emptyMessage) emptyMessage.style.display = 'none';
            recentList.innerHTML = "";
            recentSongs.forEach(songName => {
                const li = document.createElement('li');
                li.className = 'song-item';
                li.innerText = songName;
                li.addEventListener('click', () => {
                    trackName.innerText = songName;
                    alert("Tap 'Choose Audio File' to select and play: \n" + songName);
                });
                recentList.appendChild(li);
            });
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
